inputs:
  # Native 4.18 Source: collects the macOS Unified Logging Subsystem broadly.
  # Per-use-case filtering (WindowServer ping, Jetsam, security events, etc.)
  # moves to Stream-side pipelines/routes — Edge captures, Stream filters.
  # Replaces the v0.2 exec sources: macos-windowserver-health, macos-jetsam-events.
  in_apple_unified_logs:
    type: apple_unified_logs
    disabled: false
    sendToRoutes: true
    pqEnabled: false
    streamtags: []
    # NSPredicate. BEGINSWITH "com.apple" captures every Apple system subsystem
    # (kernel, WindowServer, security, network, power, Spotlight, Time Machine,
    # TCC, sandbox, etc.). Use TRUEPREDICATE if you also want 3rd-party app logs.
    predicate: 'subsystem BEGINSWITH "com.apple"'
    # Read only new entries on (re)start; switch to "allEvents" for a full backfill.
    readMode: lastEntry
    metadata:
      - name: datatype
        value: "'macos-unified-log'"

  # Native 4.18 Source: collects host CPU/memory/network/disk + process metrics.
  # Per-process / per-interface filtering moves to Stream.
  # Replaces the v0.2 exec sources: macos-memory-pressure, macos-vm-stat,
  # macos-disk-io, macos-process-top.
  in_system_metrics:
    type: system_metrics
    disabled: false
    sendToRoutes: true
    pqEnabled: false
    streamtags: []
    pollingInterval: 60
    metadata:
      - name: datatype
        value: "'macos-system-metrics'"

  # Exec source — no native 4.18 equivalent (pmset surfaces system-wide thermal
  # pressure that the System Metrics Source doesn't yet report on macOS).
  macos-thermal:
    type: exec
    disabled: false
    sendToRoutes: true
    pqEnabled: false
    streamtags: []
    command: "pmset -g therm"
    interval: 60
    metadata:
      - name: datatype
        value: "'macos-system-thermal'"

  # Exec source — no native 4.18 equivalent.
  # powermetrics is the only path to per-process energy / CPU/GPU/ANE power.
  macos-power-metrics:
    type: exec
    disabled: false
    sendToRoutes: true
    pqEnabled: false
    streamtags: []
    command: "powermetrics --samplers tasks,battery,cpu_power,gpu_power,ane_power,thermal --show-process-energy -f plist -n 1 -i 5000 | /usr/bin/plutil -convert json -o - -"
    interval: 300
    metadata:
      - name: datatype
        value: "'macos-power-metrics'"

  # Exec source — no native 4.18 equivalent.
  # Battery cycle count, max capacity, voltage etc. only come from ioreg/pmset.
  macos-power-battery:
    type: exec
    disabled: false
    sendToRoutes: true
    pqEnabled: false
    streamtags: []
    command: "/bin/bash -c 'batt=$(/usr/bin/pmset -g batt); ioreg=$(/usr/sbin/ioreg -r -c AppleSmartBattery -w0); pct=$(echo \"$batt\" | /usr/bin/awk \"/InternalBattery/{gsub(/[^0-9]/,\\\"\\\",\\$3);print \\$3}\"); src=$(echo \"$batt\" | /usr/bin/grep -q \"AC Power\" && echo AC || echo Battery); state=unknown; echo \"$batt\" | /usr/bin/grep -q \"discharging\" && state=discharging; echo \"$batt\" | /usr/bin/grep -q \"charging;\" && state=charging; echo \"$batt\" | /usr/bin/grep -q \"charged;\" && state=charged; cycle=$(echo \"$ioreg\" | /usr/bin/awk -F= \"/\\\"CycleCount\\\"/{gsub(/[^0-9]/,\\\"\\\",\\$2);print \\$2}\"); maxcap=$(echo \"$ioreg\" | /usr/bin/awk -F= \"/\\\"MaxCapacity\\\"/{gsub(/[^0-9]/,\\\"\\\",\\$2);print \\$2}\"); designcap=$(echo \"$ioreg\" | /usr/bin/awk -F= \"/\\\"DesignCapacity\\\"/{gsub(/[^0-9]/,\\\"\\\",\\$2);print \\$2}\"); curcap=$(echo \"$ioreg\" | /usr/bin/awk -F= \"/\\\"CurrentCapacity\\\"/{gsub(/[^0-9]/,\\\"\\\",\\$2);print \\$2}\"); temp=$(echo \"$ioreg\" | /usr/bin/awk -F= \"/\\\"Temperature\\\"/{gsub(/[^0-9]/,\\\"\\\",\\$2);print \\$2}\"); volt=$(echo \"$ioreg\" | /usr/bin/awk -F= \"/\\\"Voltage\\\"/{gsub(/[^0-9]/,\\\"\\\",\\$2);print \\$2}\"); /usr/bin/printf \"{\\\"charge_percent\\\":%s,\\\"power_source\\\":\\\"%s\\\",\\\"charging_state\\\":\\\"%s\\\",\\\"cycle_count\\\":%s,\\\"max_capacity\\\":%s,\\\"design_capacity\\\":%s,\\\"current_capacity\\\":%s,\\\"temperature\\\":%s,\\\"voltage\\\":%s}\\n\" \"${pct:-0}\" \"$src\" \"$state\" \"${cycle:-0}\" \"${maxcap:-0}\" \"${designcap:-0}\" \"${curcap:-0}\" \"${temp:-0}\" \"${volt:-0}\"'"
    interval: 60
    metadata:
      - name: datatype
        value: "'macos-power-battery'"

  # File source — collect-snapshot.py drops NDJSON perf snapshots here.
  # Separate data product from the native Sources; kept as-is.
  mac-perf-snapshots:
    type: file
    disabled: false
    sendToRoutes: true
    pqEnabled: false
    streamtags: []
    path: "$MAC_PERF_SNAPSHOTS_DIR"
    filenames:
      - "*.ndjson"
    tailOnly: false
    interval: 30
    metadata:
      - name: datatype
        value: "'macos-perf-snapshot'"

  # Exec source — WAN reachability: ping packet loss + latency (min/avg/max/
  # stddev ms) to the default gateway and public resolvers (1.1.1.1, 8.8.8.8).
  macos-wan-health:
    type: exec
    disabled: false
    sendToRoutes: true
    pqEnabled: false
    streamtags: []
    command: '/bin/bash -c ''gw=$(/sbin/route -n get default 2>/dev/null | sed -n "s/.*gateway: //p"); gw=${gw:-0.0.0.0}; out=""; for pair in "gateway $gw" "cloudflare 1.1.1.1" "google 8.8.8.8"; do set -- $pair; n=$1; h=$2; o=$(/sbin/ping -c 5 -i 0.2 -t 3 "$h" 2>/dev/null); l=$(echo "$o" | sed -n "s/.* \([0-9.]*\)% packet loss/\1/p"); st=$(echo "$o" | sed -n "s#.* = \([0-9./]*\) ms#\1#p"); mn=${st%%/*}; rest=${st#*/}; av=${rest%%/*}; rest=${rest#*/}; mx=${rest%%/*}; sd=${rest##*/}; out="$out,{\"name\":\"$n\",\"target\":\"$h\",\"loss_pct\":${l:-100},\"min_ms\":${mn:-null},\"avg_ms\":${av:-null},\"max_ms\":${mx:-null},\"stddev_ms\":${sd:-null}}"; done; printf "{\"probes\":[%s]}\n" "${out#,}"'''
    interval: 60
    metadata:
      - name: datatype
        value: "'macos-network-wan'"

  # Exec source — Apple's networkQuality measures responsiveness under load
  # (RPM / bufferbloat) plus down/up throughput — the canonical "true internet
  # quality" signal that idle ping can't capture. WARNING: each run is a
  # SATURATING speed test that moves significant bandwidth (potentially GBs on a
  # fast link). The 30-min interval bounds that cost; raise `interval` or set
  # `disabled: true` to dial it back. `-c` emits JSON to stdout (no script).
  macos-network-quality:
    type: exec
    disabled: false
    sendToRoutes: true
    pqEnabled: false
    streamtags: []
    command: "/usr/bin/networkQuality -c"
    interval: 1800
    metadata:
      - name: datatype
        value: "'macos-network-quality'"

  # Exec source — Wi-Fi link quality (RSSI/noise, tx rate, channel, PHY mode) so a
  # high gateway latency can be attributed to weak Wi-Fi vs a router/ISP fault.
  # `-json` emits JSON to stdout (no sudo, no script). Per the pack's
  # Edge-captures / Stream-filters rule the raw nested JSON ships as-is; pull
  # spairport_signal_noise etc. out downstream (paths documented in README).
  macos-network-wifi:
    type: exec
    disabled: false
    sendToRoutes: true
    pqEnabled: false
    streamtags: []
    command: "/usr/sbin/system_profiler -json SPAirPortDataType"
    interval: 60
    metadata:
      - name: datatype
        value: "'macos-network-wifi'"
