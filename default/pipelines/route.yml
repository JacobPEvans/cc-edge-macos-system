id: default
groups: {}
comments: []
routes:
  - id: apple-unified-logs
    name: Apple Unified Logs (Native 4.18 Source)
    final: true
    disabled: false
    pipeline: main
    description: "macOS Apple Unified Logs — broad capture (subsystem BEGINSWITH com.apple); Stream filters per use case"
    enableOutputExpression: false
    filter: __inputId=='apple_unified_logs:cc-edge-the-mac-pack-io.in_apple_unified_logs'
    clones: []
    output: default
  - id: system-metrics
    name: System Metrics (Native 4.18 Source)
    final: true
    disabled: false
    pipeline: main
    description: "macOS System Metrics — CPU/memory/disk/network/process; Stream filters per use case"
    enableOutputExpression: false
    filter: __inputId=='system_metrics:cc-edge-the-mac-pack-io.in_system_metrics'
    clones: []
    output: default
  - id: thermal
    name: Thermal Status (Exec Source)
    final: true
    disabled: false
    pipeline: main
    description: "macOS thermal and performance warning levels (pmset -g therm)"
    enableOutputExpression: false
    filter: __inputId=='exec:cc-edge-the-mac-pack-io.macos-thermal'
    clones: []
    output: default
  - id: power-metrics
    name: Power Metrics (Exec Source)
    final: true
    disabled: false
    pipeline: main
    description: "macOS powermetrics — per-process energy, CPU/GPU/ANE power, thermal (root required)"
    enableOutputExpression: false
    filter: __inputId=='exec:cc-edge-the-mac-pack-io.macos-power-metrics'
    clones: []
    output: default
  - id: power-battery
    name: Battery Health (Exec Source)
    final: true
    disabled: false
    pipeline: main
    description: "macOS battery state, charge percentage, cycle count, capacity, temperature"
    enableOutputExpression: false
    filter: __inputId=='exec:cc-edge-the-mac-pack-io.macos-power-battery'
    clones: []
    output: default
  - id: mac-perf-snapshots
    name: macOS Perf Snapshots (NDJSON File)
    final: true
    disabled: false
    pipeline: main
    description: "macOS perf snapshots tailed from NDJSON files emitted by collect-snapshot.py"
    enableOutputExpression: false
    filter: __inputId=='file:cc-edge-the-mac-pack-io.mac-perf-snapshots'
    clones: []
    output: default
